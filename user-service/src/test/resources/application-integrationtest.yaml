spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  test:
    database:
      replace: none
  liquibase:
    drop-first: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
