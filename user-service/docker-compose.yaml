services:
  user-service:
    image: user-service
    build: .
    ports:
      - "8082:8082"
    depends_on:
      - postgres
  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5433"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=user_db
      - PGDATA=/var/lib/postgresql/data/pgdata
